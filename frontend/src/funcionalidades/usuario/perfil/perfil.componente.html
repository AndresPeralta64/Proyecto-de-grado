<app-navegacion></app-navegacion>

<main class="p-4.5 min-h-[calc(100vh-64px)] bg-white">

  <h1 class="text-[23px] text-[#334155] ml-39.75 mt-[23px]">Datos de la cuenta</h1>

  <div class="p-10 px-40">
    <div class="bg-white rounded-xl border border-[#EEEEEE] p-10 shadow-sm mb-20">
      <form [formGroup]="formulario" class="grid grid-cols-1 lg:grid-cols-12 gap-10">

        <!-- Columna Izquierda: Foto de perfil -->
        <div class="lg:col-span-4 flex flex-col items-center justify-center border-r border-[#EEEEEE] pr-12">
          <div class="w-44 h-53 flex items-center justify-center overflow-hidden mb-1.5">
            <ng-container *ngIf="!fotoVistaPrevia">
              <svg class="text-[#334155] w-full h-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path fill="currentColor"
                  d="M11.967 1.752c-2.15.01-4.244.695-5.984 1.957a10.234 10.234 0 0 0-.126 16.493q.075.074.17.12a10.23 10.23 0 0 0 11.95 0a.8.8 0 0 0 .18-.13a10.235 10.235 0 0 0-.172-16.506a10.28 10.28 0 0 0-5.998-1.934zm0 3.76a4.16 4.16 0 0 1 3.878 2.534a4.14 4.14 0 0 1-.882 4.543A4.158 4.158 0 0 1 7.86 9.632a4.15 4.15 0 0 1 1.21-2.898a4.16 4.16 0 0 1 2.897-1.222m4.627 13.92a8.75 8.75 0 0 1-9.245 0a8 8 0 0 1-1.212-.9a7.1 7.1 0 0 1 2.144-2a7.23 7.23 0 0 1 7.382 0a7.1 7.1 0 0 1 2.143 2q-.563.506-1.212.9" />
              </svg>
            </ng-container>
            <img *ngIf="fotoVistaPrevia" [src]="fotoVistaPrevia" class="w-full h-full object-cover pb-2.5">
          </div>

          <span class="text-[#334155] text-sm font-medium mb-9">Foto de perfil</span>

          <button type="button" (click)="fotoInput.click()"
            class="flex items-center gap-2 bg-[#10B981] text-white px-2.5 py-1.75 rounded-lg font-semibold hover:bg-[#059669] transition-colors cursor-pointer text-[13px]">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
              <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5">
                <path stroke-linejoin="round" d="M21.25 13V8.5a5 5 0 0 0-5-5h-8.5a5 5 0 0 0-5 5v7a5 5 0 0 0 5 5h6.26" />
                <path stroke-linejoin="round"
                  d="m3.01 17l2.74-3.2a2.2 2.2 0 0 1 2.77-.27a2.2 2.2 0 0 0 2.77-.27l2.33-2.33a4 4 0 0 1 5.16-.43l2.47 1.91M8.01 10.17a1.66 1.66 0 1 0-.02-3.32a1.66 1.66 0 0 0 .02 3.32" />
                <path stroke-miterlimit="10" d="M18.707 15v5" />
                <path stroke-linejoin="round" d="m21 17.105l-1.967-1.967a.46.46 0 0 0-.652 0l-1.967 1.967" />
              </g>
            </svg>
            Subir imagen
          </button>
          <input #fotoInput type="file" (change)="seleccionarArchivo($event)" hidden accept="image/*">
        </div>

        <!-- Columna Derecha: Campos del formulario -->
        <div class="lg:col-span-8 flex flex-col gap-4">
          <div class="flex flex-col gap-1.5">
            <label class="text-[13px] font-semibold text-[#334155]">Carrera</label>
            <input formControlName="carrera"
              class="bg-[#E2E8F0] px-4 py-2 rounded-lg text-[#334155] outline-none border-none">
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="flex flex-col gap-1.5">
              <label class="text-[13px] font-semibold text-[#334155]">Nombres</label>
              <input formControlName="nombres"
                class="bg-[#E2E8F0] px-4 py-2 rounded-lg text-[#334155] outline-none border-none">
            </div>
            <div class="flex flex-col gap-1.5">
              <label class="text-[13px] font-semibold text-[#334155]">Apellidos</label>
              <input formControlName="apellidos"
                class="bg-[#E2E8F0] px-4 py-2 rounded-lg text-[#334155] outline-none border-none">
            </div>
          </div>

          <div class="flex flex-col gap-1.5">
            <label class="text-[13px] font-semibold text-[#334155]">Correo institucional</label>
            <input formControlName="correo"
              class="bg-[#E2E8F0] px-4 py-2 rounded-lg text-[#334155] outline-none border-none">
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="flex flex-col gap-1.5">
              <label class="text-[13px] font-semibold text-[#334155]">Cédula</label>
              <input formControlName="cedula"
                class="bg-[#E2E8F0] px-4 py-2 rounded-lg text-[#334155] outline-none border-none">
            </div>
            <div class="flex flex-col gap-1.5">
              <label class="text-[13px] font-semibold text-[#334155]">Teléfono</label>
              <div class="relative">
                <input formControlName="telefono" placeholder="Sin especificar" maxlength="10"
                  (keypress)="validarNumeros($event)"
                  [ngClass]="{'border-[#F86E6E]': formulario.get('telefono')?.invalid && formulario.get('telefono')?.touched}"
                  class="w-full bg-white border border-[#E2E8F0] px-4 py-2 rounded-lg text-[#334155] outline-none focus:border-[#4AB6D5] transition-colors placeholder:text-[#94A3B8] pr-10">
                <div class="absolute right-3 top-1/2 -translate-y-1/2 text-[#94A3B8]">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                      stroke-width="1.5"
                      d="m4.144 16.735l.493-3.425a.97.97 0 0 1 .293-.587l9.665-9.664a1.03 1.03 0 0 1 .973-.281a5.1 5.1 0 0 1 2.346 1.372a5.1 5.1 0 0 1 1.384 2.346a1.07 1.07 0 0 1-.282.973l-9.664 9.664a1.17 1.17 0 0 1-.598.294l-3.437.492a1.044 1.044 0 0 1-1.173-1.184m8.633-11.846l4.41 4.398M3.79 21.25h16.42" />
                  </svg>
                </div>
              </div>
              <!-- Mensaje de Error -->
              <span *ngIf="formulario.get('telefono')?.invalid && formulario.get('telefono')?.touched"
                class="text-[#ee2e2e] text-[11px] font-medium mt-0.5 animate-fade-in">
                El teléfono debe tener exactamente 10 dígitos.
              </span>
            </div>
          </div>
        </div>
      </form>

      <!-- Notificación Toast -->
      <div *ngIf="mostrarToast"
        [ngClass]="tipoToast === 'exito' ? 'bg-[#E7F9E7] border-[#D1F2D1] text-[#35BC30]' : 'bg-[#FEE7E7] border-[#FAD1D1] text-[#C12B2B]'"
        class="fixed bottom-6 right-6 px-4 py-2.5 rounded-xl shadow-lg flex items-center gap-3 animate-bounce-in z-50 border transition-all duration-300">

        <!-- Ícono de Información -->
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
          [attr.stroke]="tipoToast === 'exito' ? '#35BC30' : '#C12B2B'">
          <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2">
            <path stroke-width="1.5" d="M12 21.5a9.5 9.5 0 1 0 0-19a9.5 9.5 0 0 0 0 19m.005-4.222v-6.333" />
            <path stroke-width="2" d="M11.956 7.443h.01" />
          </g>
        </svg>

        <span class="font-medium text-sm tracking-tight">{{ mensajeToast }}</span>
      </div>
    </div>

    <!-- Botones de Acción -->
    <div class="flex flex-wrap justify-center gap-8 mt-10">
      <button (click)="actualizar()"
        class="flex items-center gap-2 bg-[#4AB6D5] border-2 border-[#2EA6C8] text-white px-2.5 py-1.75 rounded-lg font-bold hover:bg-[#43A5C2] transition-all cursor-pointer text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
            <path
              d="M21.25 9.16v7.987a4.1 4.1 0 0 1-1.204 2.901a4.1 4.1 0 0 1-2.906 1.202H6.86a4.1 4.1 0 0 1-2.906-1.202a4.1 4.1 0 0 1-1.204-2.901V6.853a4.1 4.1 0 0 1 1.204-2.901A4.1 4.1 0 0 1 6.86 2.75h8.35a3 3 0 0 1 2.25.998l3 3.415c.501.545.783 1.256.79 1.997" />
            <path
              d="M7 21.22v-5.241a1.995 1.995 0 0 1 2-1.997h6a2 2 0 0 1 2 1.997v5.241M15.8 2.81v4.183a1.526 1.526 0 0 1-1.52 1.528H9.72A1.53 1.53 0 0 1 8.2 6.993V2.75m1.946 15.108h3.708" />
          </g>
        </svg>
        Actualizar
      </button>

      <button (click)="cambiarContrasenia()"
        class="flex items-center gap-2 bg-[#4AB6D5] border-2 border-[#2EA6C8] text-white px-2.5 py-1.75 rounded-lg font-bold hover:bg-[#43A5C2] transition-all cursor-pointer text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
            <path
              d="M19.09 14.441v4.44a2.37 2.37 0 0 1-2.369 2.369H5.12a2.37 2.37 0 0 1-2.369-2.383V7.279a2.356 2.356 0 0 1 2.37-2.37H9.56" />
            <path
              d="M6.835 15.803v-2.165c.002-.357.144-.7.395-.953l9.532-9.532a1.36 1.36 0 0 1 1.934 0l2.151 2.151a1.36 1.36 0 0 1 0 1.934l-9.532 9.532a1.36 1.36 0 0 1-.953.395H8.197a1.36 1.36 0 0 1-1.362-1.362M19.09 8.995l-4.085-4.086" />
          </g>
        </svg>
        Cambiar contraseña
      </button>

      <button (click)="cancelar()"
        class="flex items-center gap-2 bg-[#E2E8F0] border-2 border-[#334155] text-[#334155] px-2.5 py-1.75 rounded-lg font-bold hover:bg-[#C9CED5] transition-all cursor-pointer text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
          <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M19 5L5 19m14 0L5 5" />
        </svg>
        Cancelar
      </button>
    </div>
  </div>
</main>
