<div class="min-h-screen w-full flex items-center justify-center bg-cover bg-center bg-no-repeat selection:bg-blue-100"
  style="background-image: url('background.png');">

  <div class="bg-white p-10 w-110 relative min-h-84.75 flex flex-col shadow-2xl rounded-sm">

    <!-- Logo -->
    <div class="mb-5">
      <img src="logo-espoch.png" alt="Logo ESPOCH" class="h-8.75">
    </div>

    <!-- Pantallas de Login -->
    <div class="grow flex flex-col overflow-hidden relative mb-3.5">

      <!-- Pantalla 1: Correo electrónico -->
      <div *ngIf="paso === 1" @stepTransition class="w-full">
        <h1 class="text-2xl font-semibold text-[#1b1b1b] mb-4">Iniciar sesión</h1>

        <form [formGroup]="formulario" (ngSubmit)="avanzar()">
          <div class="relative mb-15">
            <input type="email" formControlName="correo" placeholder="Correo electrónico"
              class="w-full border-b border-gray-400 py-2 focus:border-[#0067b8] outline-none transition-colors text-base placeholder:text-gray-600"
              [ngClass]="{'border-red-600': errorCorreo}">
            <p *ngIf="errorCorreo" class="text-red-600 text-xs mt-1 absolute">{{ errorCorreo }}</p>
          </div>

          <div class="flex justify-end mt-12">
            <button type="submit" [disabled]="cargando"
              class="bg-[#0067b8] text-white px-5.5 py-1.5 hover:bg-[#005da6] transition-colors font-semibold text-[15px] min-w-25 flex items-center gap-2 justify-center">
              <svg *ngIf="cargando" class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg"
                fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
              </svg>
              Siguiente
            </button>
          </div>
        </form>
      </div>

      <!-- Pantalla 2: Contraseña -->
      <div *ngIf="paso === 2" @stepTransition class="w-full">
        <div
          class="flex items-center gap-2 mb-3 cursor-pointer hover:bg-gray-50 p-1 -ml-1 rounded transition-colors w-fit"
          (click)="retroceder()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
            class="w-4 h-4 text-gray-700">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
          </svg>
          <span class="text-sm text-gray-700 font-normal">{{ correoIngresado }}</span>
        </div>

        <h1 class="text-2xl font-semibold text-[#1b1b1b] mb-4">Escribir contraseña</h1>

        <form [formGroup]="formulario" (ngSubmit)="avanzar()">
          <div class="relative mb-5">
            <input type="password" formControlName="contrasenia" placeholder="Contraseña"
              class="w-full border-b border-gray-400 py-2 focus:border-[#0067b8] outline-none transition-colors text-base placeholder:text-gray-600"
              [ngClass]="{'border-red-600': errorContrasenia}">
            <p *ngIf="errorContrasenia" class="text-red-600 text-xs mt-1 absolute">{{ errorContrasenia }}</p>
          </div>

          <div class="mb-8">
            <a routerLink="/autenticacion/recuperar-contrasenia" class="text-[#0067b8] text-xs hover:underline">He olvidado mi contraseña</a>
          </div>

          <div class="flex justify-end mt-8">
            <button type="submit" [disabled]="cargando"
              class="bg-[#0067b8] text-white px-5.5 py-1.5 hover:bg-[#005da6] transition-colors font-semibold text-[15px] flex items-center gap-2 min-w-30 justify-center">
              <svg *ngIf="cargando" class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg"
                fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
              </svg>
              {{ cargando ? 'Iniciando...' : 'Iniciar sesión' }}
            </button>
          </div>
        </form>
      </div>

    </div>

    <!-- Error Global (Solo para errores inesperados del servidor) -->
    <div *ngIf="mensajeError" class="mt-4 text-[13px] text-red-600 font-medium animate-fade-in">
      {{ mensajeError }}
    </div>

  </div>
</div>
