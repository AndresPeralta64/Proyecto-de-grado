<app-navegacion></app-navegacion>

<div class="flex min-h-[calc(100vh-64px)] bg-[#fffff]">

  <!-- Sidebar -->
  <app-sidebar>
    <div class="flex flex-col">

      <!-- Gestionar usuarios -->
      <a routerLink="/administrador/usuarios"
         class="flex items-center h-12 text-[#334155] no-underline transition-colors hover:bg-[#e2e8f0] hover:text-[#0067b8] cursor-pointer overflow-hidden border-b border-[#EEEEEE]"
         routerLinkActive="bg-[#e2e8f0] text-[#0067b8]">
        <!-- Ícono: mismo ancho fijo que la sidebar contraída -->
        <div class="flex items-center justify-center min-w-[64px] w-[64px]">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M17.928 19.634h2.138a1.165 1.165 0 0 0 1.116-1.555a6.85 6.85 0 0 0-6.117-3.95m0-2.759a3.664 3.664 0 0 0 3.665-3.664a3.664 3.664 0 0 0-3.665-3.674m-1.04 16.795a1.908 1.908 0 0 0 1.537-3.035a8.03 8.03 0 0 0-6.222-3.196a8.03 8.03 0 0 0-6.222 3.197a1.909 1.909 0 0 0 1.536 3.034zM9.34 11.485a4.16 4.16 0 0 0 4.15-4.161a4.151 4.151 0 0 0-8.302 0a4.16 4.16 0 0 0 4.151 4.16"/>
          </svg>
        </div>
        <!-- Etiqueta: solo visible cuando está expandido -->
        <span class="text-sm font-medium whitespace-nowrap pr-4" *ngIf="expandido">
          Gestionar usuarios
        </span>
      </a>

      <!-- Gestionar microcredenciales -->
      <a routerLink="/administrador/microcredenciales"
         class="flex items-center h-12 text-[#334155] no-underline transition-colors hover:bg-[#e2e8f0] hover:text-[#0067b8] cursor-pointer overflow-hidden border-b border-[#EEEEEE]"
         routerLinkActive="bg-[#e2e8f0] text-[#0067b8]">
        <div class="flex items-center justify-center min-w-[64px] w-[64px]">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 512 512">
            <path fill="currentColor" d="m328.375 384l3.698 74.999l-75.862-52.719l-76.287 52.769L183.625 384h-32.039l-5.522 112h36.692l73.413-50.78L329.242 496h36.694l-5.522-112zm87.034-229.086l-2.194-48.054L372.7 80.933l-25.932-40.519l-48.055-2.2L256 16.093l-42.713 22.126l-48.055 2.2L139.3 80.933L98.785 106.86l-2.194 48.054l-22.127 42.714l22.127 42.715l2.2 48.053l40.509 25.927l25.928 40.52l48.055 2.195L256 379.164l42.713-22.126l48.055-2.195l25.928-40.52l40.518-25.923l2.195-48.053l22.127-42.715Zm-31.646 76.949L382 270.377l-32.475 20.78l-20.78 32.475l-38.515 1.76L256 343.125l-34.234-17.733l-38.515-1.76l-20.78-32.475L130 270.377l-1.759-38.514l-17.741-34.235l17.737-34.228L130 124.88l32.471-20.78l20.78-32.474l38.515-1.76L256 52.132l34.234 17.733l38.515 1.76l20.78 32.474L382 124.88l1.759 38.515l17.741 34.233Z"/>
          </svg>
        </div>
        <span class="text-sm font-medium whitespace-nowrap pr-4" *ngIf="expandido">
          Gestionar microcredenciales
        </span>
      </a>

      <!-- Ver insignias emitidas -->
      <a routerLink="/administrador/insignias"
         class="flex items-center h-12 text-[#334155] no-underline transition-colors hover:bg-[#e2e8f0] hover:text-[#0067b8] cursor-pointer overflow-hidden border-b border-[#EEEEEE]"
         routerLinkActive="bg-[#e2e8f0] text-[#0067b8]">
        <div class="flex items-center justify-center min-w-[64px] w-[64px]">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
              <path d="M4.268 4.328C5.954 3.028 8.573 2 12 2s6.046 1.027 7.732 2.328c.237.182.356.274.453.436c.082.136.14.342.143.5c.002.189-.06.357-.187.692c-.31.83-.466 1.244-.529 1.654c-.079.518-.08.645-.007 1.163c.058.412.375 1.287 1.007 3.037A6.4 6.4 0 0 1 21 14c0 3-2.5 5.375-5 6c-2.192.548-3.333 1.333-4 2c-.667-.667-1.808-1.452-4-2c-2.5-.625-5-3-5-6c0-.82.156-1.548.388-2.19c.633-1.75.949-2.625 1.007-3.037c.073-.518.072-.645-.007-1.163c-.063-.41-.218-.825-.53-1.654c-.125-.335-.188-.503-.185-.692a1.1 1.1 0 0 1 .142-.5c.097-.162.216-.254.453-.436"/>
              <path d="m12.691 7.578l.704 1.42a.87.87 0 0 0 .568.423l1.276.213c.816.137 1.008.734.42 1.323l-.992 1a.88.88 0 0 0-.208.73l.284 1.238c.224.98-.292 1.359-1.152.847l-1.196-.714a.86.86 0 0 0-.792 0l-1.196.714c-.856.512-1.376.129-1.152-.847l.284-1.238a.88.88 0 0 0-.208-.73l-.991-1c-.584-.589-.396-1.186.42-1.323l1.275-.213a.87.87 0 0 0 .564-.424l.704-1.42c.384-.77 1.008-.77 1.388 0"/>
            </g>
          </svg>
        </div>
        <span class="text-sm font-medium whitespace-nowrap pr-4" *ngIf="expandido">
          Ver insignias emitidas
        </span>
      </a>

    </div>
  </app-sidebar>

  <!-- Contenido Principal -->
  <main class="flex-1 p-10 transition-all duration-250"
        [style.margin-left]="expandido ? '280px' : '64px'">

    <h1 class="text-[22px] font-semibold text-[#334155] mb-8">Panel de Administración</h1>

    <!-- Cuadro para futuro Dashboard -->
    <div class="bg-white rounded-xl border border-[#EEEEEE] shadow-sm min-h-[480px] flex flex-col items-center justify-center text-center p-12">
      <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mb-5 border border-[#EEEEEE]">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" class="text-[#334155]">
          <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M3 13.125c0-1.727 0-2.59.313-3.26c.313-.672.936-1.27 2.183-2.464l1.607-1.538c2.441-2.336 3.662-3.504 5.147-3.79c.28-.054.57-.08.861-.08c.29 0 .58.026.861.08c1.485.286 2.706 1.454 5.147 3.79l1.607 1.538c1.247 1.194 1.87 1.792 2.183 2.464c.312.67.312 1.533.312 3.26V15c0 3.771 0 5.657-1.172 6.828C20.89 23 19.002 23 15.227 23H8.773c-3.776 0-5.663 0-6.835-1.172C.765 20.657.765 18.771.765 15zM12 18v-3"/>
        </svg>
      </div>
      <h2 class="text-xl font-semibold text-[#334155] mb-2">Dashboard Principal</h2>
      <p class="text-[#64748b] text-sm max-w-sm leading-relaxed">
        Este espacio está reservado para estadísticas y métricas generales del sistema.
      </p>
    </div>

  </main>
</div>
