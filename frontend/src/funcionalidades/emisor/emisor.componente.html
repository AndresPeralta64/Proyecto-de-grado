<app-navegacion></app-navegacion>

<div class="flex h-[calc(100vh-64px)] min-h-[calc(100vh-64px)] bg-[#fffff] relative overflow-hidden">

  <!-- Sidebar -->

    <div class="flex flex-col">

      <!-- Gestionar microcredenciales -->
      <a routerLink="/emisor/microcredenciales"
        class="flex items-center h-12 text-[#334155] no-underline transition-colors hover:bg-[#e2e8f0] hover:text-[#0067b8] cursor-pointer overflow-hidden border-b border-[#EEEEEE]"
        routerLinkActive="bg-[#e2e8f0] text-[#0067b8]">
        <div class="flex items-center justify-center min-w-[64px] w-[64px]">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 512 512">
            <path fill="currentColor"
              d="m328.375 384l3.698 74.999l-75.862-52.719l-76.287 52.769L183.625 384h-32.039l-5.522 112h36.692l73.413-50.78L329.242 496h36.694l-5.522-112zm87.034-229.086l-2.194-48.054L372.7 80.933l-25.932-40.519l-48.055-2.2L256 16.093l-42.713 22.126l-48.055 2.2L139.3 80.933L98.785 106.86l-2.194 48.054l-22.127 42.714l22.127 42.715l2.2 48.053l40.509 25.927l25.928 40.52l48.055 2.195L256 379.164l42.713-22.126l48.055-2.195l25.928-40.52l40.518-25.923l2.195-48.053l22.127-42.715Zm-31.646 76.949L382 270.377l-32.475 20.78l-20.78 32.475l-38.515 1.76L256 343.125l-34.234-17.733l-38.515-1.76l-20.78-32.475L130 270.377l-1.759-38.514l-17.741-34.235l17.737-34.228L130 124.88l32.471-20.78l20.78-32.474l38.515-1.76L256 52.132l34.234 17.733l38.515 1.76l20.78 32.474L382 124.88l1.759 38.515l17.741 34.233Z" />
          </svg>
        </div>
        <span class="text-sm font-medium whitespace-nowrap pr-4" *ngIf="expandido">
          Crear microcredenciales
        </span>
      </a>

      <!-- Gestionar insignias -->
      <a routerLink="/emisor/insignias"
        class="flex items-center h-12 text-[#334155] no-underline transition-colors hover:bg-[#e2e8f0] hover:text-[#0067b8] cursor-pointer overflow-hidden border-b border-[#EEEEEE]"
        routerLinkActive="bg-[#e2e8f0] text-[#0067b8]">

            </g>
          </svg>
        </div>
        <span class="text-sm font-medium whitespace-nowrap pr-4" *ngIf="expandido">
          Emitir insignias digitales
        </span>
      </a>

      <!-- Perfiles académicos -->
      <a routerLink="/perfiles-academicos"
        class="flex items-center h-12 text-[#334155] no-underline transition-colors hover:bg-[#e2e8f0] hover:text-[#0067b8] cursor-pointer overflow-hidden border-b border-[#EEEEEE]"
        routerLinkActive="bg-[#e2e8f0] text-[#0067b8]">
        <div class="flex items-center justify-center min-w-[64px] w-[64px]">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
              <path d="M14.186 2.753v3.596c0 .487.195.955.54 1.3a1.85 1.85 0 0 0 1.306.539h4.125" />
              <path
                d="M20.25 8.568v8.568a4.25 4.25 0 0 1-1.362 2.97a4.28 4.28 0 0 1-3.072 1.14h-7.59a4.3 4.3 0 0 1-3.1-1.124a4.26 4.26 0 0 1-1.376-2.986V6.862a4.25 4.25 0 0 1 1.362-2.97a4.28 4.28 0 0 1 3.072-1.14h5.714a3.5 3.5 0 0 1 2.361.905l2.96 2.722a2.97 2.97 0 0 1 1.031 2.189M7.647 7.647h3.265M7.647 12h8.706m-8.706 4.353h8.706" />
            </g>
          </svg>
        </div>
        <span class="text-sm font-medium whitespace-nowrap pr-4" *ngIf="expandido">
          Perfiles académicos
        </span>
      </a>

      <!-- Microcredenciales públicas -->
      <a routerLink="/microcredenciales-publicas"
        class="flex items-center h-12 text-[#334155] no-underline transition-colors hover:bg-[#e2e8f0] hover:text-[#0067b8] cursor-pointer overflow-hidden border-b border-[#EEEEEE]"
        routerLinkActive="bg-[#e2e8f0] text-[#0067b8]">
        <div class="flex items-center justify-center min-w-[64px] w-[64px]">
          <svg xmlns="http://www.w3.org/2000/svg" width="18.7" height="22" viewBox="0 0 15 15">
            <path d="M0 0h15v15H0z" fill="none" />
            <path fill="currentColor"

          </svg>
        </div>
        <span class="text-sm font-medium whitespace-nowrap pr-4" *ngIf="expandido">
          Microcredenciales públicas
        </span>
      </a>

    </div>
  </app-sidebar>

  <!-- Contenido Principal -->
  <main class="flex-1 h-full min-h-0 overflow-y-auto p-20 transition-all duration-250"
    [style.margin-left]="expandido ? '280px' : '64px'">
    <router-outlet></router-outlet>
  </main>
</div>
